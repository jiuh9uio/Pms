name: Windows-Version (pms.exe)

on:
  workflow_dispatch:
  push:
    branches: ['claude/hotel-pms-gmx-0rifkh', 'main']
    paths: ['src/**', 'web/**', 'migrations/**', 'assets/**', 'scripts/**', 'CHANGELOG.md', 'package*.json', '.github/workflows/windows-exe.yml']

permissions:
  contents: write # für die Veröffentlichung neuer Versionen (GitHub Release)

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Paket bauen (pms.exe + PostgreSQL)
        shell: pwsh
        run: |
          Write-Host "PostgreSQL aus $env:PGROOT"
          & "$env:PGBIN\postgres.exe" --version
          node scripts/build-exe.mjs "$env:PGROOT"

      - name: Funktionstest unter Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "release\SchuetzenhausPMS"
          $base = "http://127.0.0.1:3000/api/v1"
          function Start-Pms { Start-Process -FilePath "$dir\pms.exe" -ArgumentList '--no-browser' -WorkingDirectory $dir -RedirectStandardOutput "$dir\run.log" -RedirectStandardError "$dir\err.log" -PassThru }
          function Show-Logs { Get-ChildItem "$dir\*.log", "$dir\data\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "===== $($_.Name)"; Get-Content $_.FullName -Tail 60 } }
          function Wait-Pms { foreach ($i in 1..45) { try { Invoke-RestMethod "$base/health" -TimeoutSec 2 | Out-Null; return } catch { Start-Sleep 1 } }; Show-Logs; throw 'PMS ist nicht gestartet' }
          function Stop-Pms($p) { Stop-Process -Id $p.Id -Force; & "$dir\pgsql\bin\pg_ctl.exe" stop -D "$dir\data\postgres" -m fast -w }
          function Post($path, $body, $s) { Invoke-RestMethod -Method Post -Uri "$base$path" -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 6) -WebSession $s }

          $p = Start-Pms; Wait-Pms
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Post '/auth/setup' @{ username = 'chef'; name = 'Test'; password = 'sehr-geheim-123' } $s | Out-Null
          $cat = Post '/categories' @{ name = 'Doppelzimmer'; description = ''; stdOccupancy = 2; maxPersons = 2; basePriceCents = 9900; sort = 1 } $s
          $rooms = Post '/rooms/bulk' @{ categoryId = $cat.id; count = 3; firstNumber = 101; floor = '1' } $s
          if ($rooms.created -ne 3) { throw 'Zimmer wurden nicht angelegt' }
          $room = (Invoke-RestMethod "$base/rooms" -WebSession $s)[0]
          $guest = @{ salutation = ''; firstName = 'Test'; lastName = 'Gast'; company = ''; email = ''; phone = ''; street = ''; zip = ''; city = ''; country = ''; birthdate = ''; nationality = ''; idNumber = ''; notes = '' }
          $booking = @{ guest = $guest; groupName = ''; source = 'Telefon'; paymentMethod = ''; notes = ''; breakfast = $false
            rooms = @(@{ roomId = $room.id; from = '2031-05-08'; to = '2031-05-11'; adults = 2; children = 0; status = 'confirmed'; pricePerNightCents = $null }) }
          $b = Post '/bookings' $booking $s
          Write-Host "Buchung $($b.number) angelegt"
          $clash = $false
          try { Post '/bookings' $booking $s | Out-Null } catch { $clash = $_.Exception.Response.StatusCode.value__ -eq 409 }
          if (-not $clash) { throw 'Doppelbuchung wurde nicht abgelehnt' }
          $hotel = Invoke-RestMethod "$base/settings/hotel" -WebSession $s
          $hotel.street = 'Teststr. 1'; $hotel.zip = '12345'; $hotel.city = 'Teststadt'; $hotel.taxNumber = '12/345/67890'
          Invoke-RestMethod -Method Put -Uri "$base/settings/hotel" -ContentType 'application/json' -Body ($hotel | ConvertTo-Json -Depth 4) -WebSession $s | Out-Null
          $inv = Post '/invoices' @{ bookingId = $b.id; include = 'all' } $s
          $draft = Invoke-RestMethod "$base/invoices/$($inv.id)" -WebSession $s
          $issued = Post "/invoices/$($inv.id)/issue" @{ version = $draft.version } $s
          if (-not $issued.number -or $issued.grossCents -ne 29700) { throw "Rechnung falsch ausgestellt: $($issued | ConvertTo-Json -Depth 2)" }
          Post '/payments' @{ invoiceId = $inv.id; amountCents = 29700; method = 'Bar'; date = (Get-Date -Format 'yyyy-MM-dd'); payer = ''; note = '' } $s | Out-Null
          Write-Host "Rechnung $($issued.number) ausgestellt und bezahlt"
          $e = Post "/einvoices/from-invoice/$($inv.id)" @{} $s
          Invoke-WebRequest "$base/einvoices/$($e.id)/pdf" -WebSession $s -OutFile "$dir\e-rechnung.pdf"
          $pdfText = [System.Text.Encoding]::GetEncoding(28591).GetString([System.IO.File]::ReadAllBytes("$dir\e-rechnung.pdf"))
          if (-not $pdfText.StartsWith('%PDF-') -or -not $pdfText.Contains('factur-x.xml')) { throw 'E-Rechnung enthält keine eingebettete factur-x.xml' }
          Remove-Item "$dir\e-rechnung.pdf"
          Write-Host 'E-Rechnung (ZUGFeRD) erzeugt'
          if ((Invoke-WebRequest 'http://127.0.0.1:3000/plan').StatusCode -ne 200) { throw 'Oberfläche wird nicht ausgeliefert' }

          & "$dir\pms.exe" --backup
          if (-not (Get-ChildItem "$dir\backups\*.dump")) { throw 'Keine Sicherung geschrieben' }

          Stop-Pms $p
          $p = Start-Pms; Wait-Pms
          $s2 = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Post '/auth/login' @{ username = 'chef'; password = 'sehr-geheim-123' } $s2 | Out-Null
          $list = Invoke-RestMethod "$base/bookings?status=active" -WebSession $s2
          if ($list.Count -ne 1) { throw 'Daten nach Neustart nicht vorhanden' }
          $invs = Invoke-RestMethod "$base/invoices" -WebSession $s2
          if ($invs.Count -ne 1 -or $invs[0].openCents -ne 0) { throw 'Rechnung nach Neustart nicht vorhanden oder nicht bezahlt' }
          Stop-Pms $p

          $dump = (Get-ChildItem "$dir\backups\*.dump")[0].FullName
          & "$dir\pms.exe" --restore $dump --ja
          if ($LASTEXITCODE -ne 0) { throw 'Wiederherstellung fehlgeschlagen' }
          Write-Host 'Funktionstest bestanden'

      - name: Testdaten entfernen
        shell: pwsh
        run: Remove-Item -Recurse -Force release\SchuetzenhausPMS\data, release\SchuetzenhausPMS\backups, release\SchuetzenhausPMS\*.log

      - name: Update-Paket packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Compress-Archive -Path release\SchuetzenhausPMS -DestinationPath pkg\SchuetzenhausPMS-Windows.zip
          $hash = (Get-FileHash pkg\SchuetzenhausPMS-Windows.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path pkg\SchuetzenhausPMS-Windows.zip.sha256 -Value "$hash  SchuetzenhausPMS-Windows.zip" -Encoding ascii
          $v = (Get-Content release\SchuetzenhausPMS\app\version.json | ConvertFrom-Json).version
          "PMS_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Update-Test unter Windows (alte Version aktualisiert sich selbst)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = "$PWD\updtest\SchuetzenhausPMS"
          $base = "http://127.0.0.1:3000/api/v1"
          New-Item -ItemType Directory updtest, updsrv | Out-Null
          Copy-Item -Recurse release\SchuetzenhausPMS $old
          Copy-Item pkg\* updsrv\
          # Die Kopie gibt sich als ältere Version aus und fragt einen lokalen Test-Server statt GitHub
          $info = Get-Content "$old\app\version.json" | ConvertFrom-Json
          $info.version = '0.0.1'
          [System.IO.File]::WriteAllText("$old\app\version.json", ($info | ConvertTo-Json))
          [System.IO.File]::WriteAllText("$old\pms.env", "PORT=3000`r`nHOST=127.0.0.1`r`nPMS_UPDATE_URL=http://127.0.0.1:8099/latest.json`r`nPMS_UPDATE_CHECK=off`r`n")
          $latest = @{ tag_name = "v$env:PMS_VERSION"; body = 'Test'; assets = @(
            @{ name = 'SchuetzenhausPMS-Windows.zip'; browser_download_url = 'http://127.0.0.1:8099/SchuetzenhausPMS-Windows.zip' },
            @{ name = 'SchuetzenhausPMS-Windows.zip.sha256'; browser_download_url = 'http://127.0.0.1:8099/SchuetzenhausPMS-Windows.zip.sha256' }) }
          [System.IO.File]::WriteAllText("$PWD\updsrv\latest.json", ($latest | ConvertTo-Json -Depth 4))
          $web = Start-Process python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1' -WorkingDirectory updsrv -PassThru
          function Show-Logs { Get-ChildItem "$old\*.log", "$old\data\*.log", "$old\update\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "===== $($_.Name)"; Get-Content $_.FullName -Tail 60 } }
          function Post($path, $body, $s) { Invoke-RestMethod -Method Post -Uri "$base$path" -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 6) -WebSession $s }
          try {
            Start-Process -FilePath "$old\pms.exe" -ArgumentList '--no-browser' -WorkingDirectory $old -RedirectStandardOutput "$old\run.log" -RedirectStandardError "$old\err.log" | Out-Null
            $up = $false
            foreach ($i in 1..45) { try { Invoke-RestMethod "$base/health" -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
            if (-not $up) { throw 'Alte Version ist nicht gestartet' }
            $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Post '/auth/setup' @{ username = 'chef'; name = 'Test'; password = 'sehr-geheim-123' } $s | Out-Null
            Post '/categories' @{ name = 'Doppelzimmer'; description = ''; stdOccupancy = 2; maxPersons = 2; basePriceCents = 9900; sort = 1 } $s | Out-Null
            $st = Invoke-RestMethod "$base/update/status?refresh=1" -WebSession $s
            if (-not $st.available -or $st.current -ne '0.0.1') { throw "Update wurde nicht erkannt: $($st | ConvertTo-Json)" }
            $r = Post '/update/install' @{} $s
            Write-Host "Update auf $($r.version) angestossen"
            $done = $false
            foreach ($i in 1..90) {
              Start-Sleep 2
              try { $st = Invoke-RestMethod "$base/update/status" -WebSession $s -TimeoutSec 3; if ($st.current -eq $env:PMS_VERSION) { $done = $true; break } } catch { }
            }
            if (-not $done) { throw 'Die neue Version hat sich nach dem Update nicht gemeldet' }
            $cats = @(Invoke-RestMethod "$base/categories" -WebSession $s)
            if ($cats.Count -ne 1) { throw 'Daten nach dem Update nicht vorhanden' }
            if (-not (Get-ChildItem "$old\backups\*.dump")) { throw 'Vor dem Update wurde keine Sicherung geschrieben' }
            if (-not (Test-Path "$old\update\previous\pms.exe")) { throw 'Vorherige Programmdateien wurden nicht aufbewahrt' }
            if (-not (Get-Content "$old\pms.env" -Raw).Contains('PMS_UPDATE_URL')) { throw 'pms.env wurde überschrieben' }
            Get-Content "$old\update\update.log"
            Write-Host 'Update-Test bestanden'
          } catch { Show-Logs; throw } finally {
            Get-Process pms -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path "$old\data\postgres\postmaster.pid") { & "$old\pgsql\bin\pg_ctl.exe" stop -D "$old\data\postgres" -m fast -w }
            Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SchuetzenhausPMS-Windows
          path: release/SchuetzenhausPMS
          retention-days: 90

      # Neue Versionsnummer in package.json => einmalige Veröffentlichung, die installierte Programme als Update finden
      - name: Version veröffentlichen (nur wenn noch nicht vorhanden)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PMS_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag ist bereits veröffentlicht"; $global:LASTEXITCODE = 0; exit 0 }
          node scripts/release-notes.mjs $env:PMS_VERSION > notes.md
          gh release create $tag pkg/SchuetzenhausPMS-Windows.zip pkg/SchuetzenhausPMS-Windows.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Schützenhaus PMS $env:PMS_VERSION" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Veröffentlichung fehlgeschlagen' }
